[project]
name = "mavctl"
# First formal release. docs/PUBLISHING.md records the release procedure:
# the v0.2.0 tag is created only after the release PR has merged.
version = "0.2.0"
description = "Headless, agent-first MAVLink ground-control CLI for ArduPilot vehicles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "LeaderOnePro" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pymavlink>=2.4.40",
]

[project.urls]
Homepage = "https://github.com/LeaderOnePro/mavctl"
Repository = "https://github.com/LeaderOnePro/mavctl"
Issues = "https://github.com/LeaderOnePro/mavctl/issues"
Documentation = "https://github.com/LeaderOnePro/mavctl/tree/main/docs"

[project.scripts]
mavctl = "mavctl.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mavctl"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
files = ["src", "tests"]

# pymavlink ships no type stubs.
[[tool.mypy.overrides]]
module = ["pymavlink.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "sitl: integration tests requiring a running ArduPilot SITL (deselect with -m 'not sitl')",
]

[tool.coverage.run]
source = ["mavctl"]
