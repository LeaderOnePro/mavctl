[project]
name = "mavctl"
version = "0.1.0"
description = "Headless ground control station CLI for MAVLink vehicles (ArduPilot-first)"
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pymavlink>=2.4.40",
]

[project.scripts]
mavctl = "mavctl.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mavctl"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
files = ["src", "tests"]

# pymavlink ships no type stubs.
[[tool.mypy.overrides]]
module = ["pymavlink.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "sitl: integration tests requiring a running ArduPilot SITL (deselect with -m 'not sitl')",
]

[tool.coverage.run]
source = ["mavctl"]
